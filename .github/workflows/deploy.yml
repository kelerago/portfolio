name: Deploy to GCP VM
run-name: Deploy ${{ github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build to VM
        run: |
          cd dist && tar czf ../dist.tar.gz . && cd ..
          scp -o StrictHostKeyChecking=accept-new dist.tar.gz \
            ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:~/

      - name: Extract and apply on VM
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} "
            sudo mkdir -p ${{ vars.WEB_ROOT }} &&
            sudo tar xzf ~/dist.tar.gz -C ${{ vars.WEB_ROOT }} &&
            sudo chown -R www-data:www-data ${{ vars.WEB_ROOT }} &&
            rm ~/dist.tar.gz
          "

      - name: Reload nginx
        run: |
          ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} \
            "sudo systemctl reload nginx || true"
